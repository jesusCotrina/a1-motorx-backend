name: Build y deploy del backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-y-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # Generamos dos tags:
      # - latest       -> referencia mutable
      # - SHA corto    -> referencia inmutable
      - name: Definir imagen
        id: imagen
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(echo '${{ github.sha }}' | cut -c1-7)

          echo "latest=ghcr.io/${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "version=ghcr.io/${REPO}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.imagen.outputs.latest }}
            ${{ steps.imagen.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar la Container App con la nueva imagen
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name a1-motorx-backend \
              --resource-group a1-motorx \
              --image ${{ steps.imagen.outputs.version }}